server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/api/orders/**
        - id: dispatch-service
          uri: http://dispatch-service:8082
          predicates:
            - Path=/api/dispatch/**
        - id: tracking-service
          uri: http://tracking-service:8084
          predicates:
            - Path=/api/tracking/**
        - id: notification-service
          uri: http://notification-service:8083
          predicates:
            - Path=/api/notifications/**
        - id: gps-service
          uri: http://gps-service:8085
          predicates:
            - Path=/api/gps/**
