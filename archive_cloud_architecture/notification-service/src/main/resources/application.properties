server.port=8083
spring.application.name=notification-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://logistics-postgres:5432/notification_db
spring.datasource.username=logistics_user
spring.datasource.password=logistics_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=logistics-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=adminpassword
